Organizations:
  - &NorthOrg
    Name: NorthMSP
    ID: NorthMSP
    MSPDir: crypto-config/peerOrganizations/north.farm.tn/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('NorthMSP.admin', 'NorthMSP.peer', 'NorthMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('NorthMSP.admin', 'NorthMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('NorthMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('NorthMSP.peer')"
    AnchorPeers:
      - Host: peer0.north.farm.tn
        Port: 7051
  - &SouthOrg
    Name: SouthMSP
    ID: SouthMSP
    MSPDir: crypto-config/peerOrganizations/south.farm.tn/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('SouthMSP.admin', 'SouthMSP.peer', 'SouthMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('SouthMSP.admin', 'SouthMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('SouthMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('SouthMSP.peer')"
    AnchorPeers:
      - Host: peer0.south.farm.tn
        Port: 8051
  - &EastOrg
    Name: EastMSP
    ID: EastMSP
    MSPDir: crypto-config/peerOrganizations/east.farm.tn/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('EastMSP.admin', 'EastMSP.peer', 'EastMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('EastMSP.admin', 'EastMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('EastMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('EastMSP.peer')"
    AnchorPeers:
      - Host: peer0.east.farm.tn
        Port: 9051
  - &WestOrg
    Name: WestMSP
    ID: WestMSP
    MSPDir: crypto-config/peerOrganizations/west.farm.tn/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('WestMSP.admin', 'WestMSP.peer', 'WestMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('WestMSP.admin', 'WestMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('WestMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('WestMSP.peer')"
    AnchorPeers:
      - Host: peer0.west.farm.tn
        Port: 10051
Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: Signature
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer0.farm.tn:7050
    - orderer1.farm.tn:8050
    - orderer2.farm.tn:9050
  BatchTimeout: 2h
  BatchSize:
    MaxMessageCount: 100
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  EtcdRaft:
    Consenters:
      - Host: orderer0.farm.tn
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer0.farm.tn/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer0.farm.tn/tls/server.crt
      - Host: orderer1.farm.tn
        Port: 8050
        ClientTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer1.farm.tn/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer1.farm.tn/tls/server.crt
      - Host: orderer2.farm.tn
        Port: 9050
        ClientTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer2.farm.tn/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/farm.tn/orderers/orderer2.farm.tn/tls/server.crt
    Options:
      TickInterval: 500ms
      ElectionTick: 10
      HeartbeatTick: 1
      MaxInflightBlocks: 5
      SnapshotIntervalSize: 16 MB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  FarmGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *NorthOrg
        - *SouthOrg
        - *EastOrg
        - *WestOrg
    Consortiums:
      FarmConsortium:
        Organizations:
          - *NorthOrg
        - *SouthOrg
        - *EastOrg
        - *WestOrg
  FarmChannel:
    Consortium: FarmConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *NorthOrg
        - *SouthOrg
        - *EastOrg
        - *WestOrg
