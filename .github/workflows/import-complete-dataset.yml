name: Import complete dataset

on:
  push:
    branches:
      - main
    paths:
      - .dataset_import/**
      - .github/workflows/import-complete-dataset.yml

permissions:
  contents: write

jobs:
  import-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace data directory
        shell: bash
        run: |
          set -euo pipefail
          cat .dataset_import/part-* > /tmp/complete-dataset.zip
          rm -rf data
          unzip -q /tmp/complete-dataset.zip -d /tmp/complete-dataset
          mv /tmp/complete-dataset/blockchain-fet-complete-dataset/data ./data
          test "$(find data -type f | wc -l)" -eq 71
          test "$(find data -type f -printf '%s\n' | awk '{s+=$1} END {print s}')" -eq 137694091
          rm -rf .dataset_import

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A data .dataset_import
          git add -f data/raw/provenance/device_logs data/raw/provenance/gateway_logs
          test "$(git ls-files data | wc -l)" -eq 71
          git commit -m "Replace data directory with complete dataset"
          git push
